<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>

<body class="body">
    <div class=" p-5">
        <div class="cont2 text-center mb-5">
            <h1>Number Guessing Game</h1>
            <i onclick="istruzioni()" class="arrow bi bi-arrow-right-circle" id="icona">Istruzioni</i>
            <p id="testo" class="d-none mt-2">
                Il computer genera un numero casuale tra 0e100. Tu dovrai indovinarlo con 7 tentativi
            </p>
            <form>
                <button onclick="gioca()" type="button" class="my-3  btn bg-info-subtle text-white">GIOCA</button>
            </form>
        </div>
        <div class="cont3 text-center py-3 d-none " id="game">
            <input type="number" id="check" class="w-25 " placeholder="Inserisci numero ">
            <button onclick="indovina()" type="button" class="btn btn-primary">Check</button>
            <h1 id="risultato"></h1>
            <div class="row mx-5 my-4">
                <div class="colonna col-md-4 text-center py-3">
                    <h5>Tentativi Rimasti</h5>
                    <i class="icone bi bi-joystick"></i>
                    <p id="tentativi">7</p>
                </div>
                <div class="colonna col-md-4 text-center py-3 col-md-4">
                    <h5>Suggerimenti</h5> <i class="icone bi bi-info-square"></i>

                    <p id="hints"></p>
                </div>
                <div class="colonna col-md-4 text-center py-3 col-md-4">
                    <h5>Numeri inseriti</h5>
                    <i class="icone bi bi-pencil-square"></i>
                    <p id="inseriti"></p>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>

</html>
